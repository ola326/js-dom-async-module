<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Interactive To-Do List</h1>

  <ul id="todo-list">
    <li class="todo-item">
      Buy groceries <span class="checkmark">✔</span>
    </li>
    <li class="todo-item">
      Complete assignment <span class="checkmark">✔</span>
    </li>
    <li class="todo-item">
      Call a friend <span class="checkmark">✔</span>
    </li>
  </ul>

  <script src="script.js"></script>
</body>
</html>
